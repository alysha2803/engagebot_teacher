name: engagebot_teacher
description: EngageBot Smart Classroom — Teacher Analytics Application
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.0.0

  # HTTP client (used by ApiService)
  dio: ^5.4.0

  # Charts
  fl_chart: ^0.68.0

  # Local storage (settings + JWT token)
  shared_preferences: ^2.2.3

  # Images
  cached_network_image: ^3.3.1

  # Typography
  google_fonts: ^6.2.1

  # Internationalisation / date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
